# Configuración de Ruff para el proyecto
target-version = "py37"
line-length = 80

# Reglas habilitadas
[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

ignore = [
    "B008",  # do not perform function calls in argument defaults
]

# Configuración de isort (ordenamiento de imports)
[lint.isort]
known-first-party = ["app"]

# Configuración del formateador
[format]
quote-style = "double"
indent-style = "space"

